root_overview:
  ai-gen:
    keywords: ontap rest, ontap automation, ontap storage, ontap clusters, ontap svm
    lead: This page introduces the ONTAP REST API, detailing an extensive array of
      API calls available for automating tasks within ONTAP. You can explore the types
      of API calls, understand their functionalities, and learn how to utilize each
      endpoint effectively.
categories:
- id: cloud
  title: ONTAP REST API cloud endpoints
  permalink: cloud_endpoints.html
  ai-gen:
    keywords: cloud targets,object storage,manage cloud,cloud management,storage targets
    lead: Use cloud endpoints to manage object storage targets effectively within
      your environment.
- id: cluster
  title: ONTAP REST API cluster endpoints
  permalink: cluster_endpoints.html
  ai-gen:
    keywords: cluster creation,add nodes,cluster configuration,node management,software
      update,cluster network
    lead: Manage cluster creation, configuration, nodes, and software updates using
      these endpoints to streamline and oversee your ONTAP cluster operations. Utilize
      pre-cluster APIs to initiate cluster formation and track its progress efficiently.
- id: networking
  title: ONTAP REST API networking endpoints
  permalink: networking_endpoints.html
  ai-gen:
    keywords: networking information,ipspaces,ethernet ports,fibre channel interfaces,broadcast
      domains,routing tables
    lead: Explore networking endpoints to report and manage networking configurations,
      including IPspaces, interfaces, routes, ports, service policies, and broadcast
      domains. Utilize these endpoints to maintain optimal network performance and
      security within your ONTAP environment.
- id: svm
  title: ONTAP REST API SVM endpoints
  permalink: svm_endpoints.html
  ai-gen:
    keywords: storage virtual machine,nfs configuration,cifs protocol,export policies,name
      mappings,network services
    lead: SVM endpoints empower you to manage Storage Virtual Machines and their attributes,
      including protocol configurations and network services. Use these APIs to independently
      administer SVMs, facilitating secure data access within a cluster.
- id: name-services
  title: ONTAP REST API name-services endpoints
  permalink: name-services_endpoints.html
  ai-gen:
    keywords: name services,dns resolution,user credentials,ldap configuration,nis
      setup,network information
    lead: Use name-services endpoints to retrieve and configure information about
      users and clients for authentication and credential mapping within ONTAP. These
      endpoints facilitate integration with NIS and LDAP servers for user database
      management and employ DNS for hostname resolution. Configure ns-switch to manage
      network information search sources and order within SVMs.
- id: san
  title: ONTAP REST API SAN endpoints
  permalink: san_endpoints.html
  ai-gen:
    keywords: san configuration,fibre channel logins,wwpn aliases,iscsi sessions,lun
      maps
    lead: Configure, provision, and manage SAN-related objects using the storage area
      network (SAN) endpoints. These endpoints are essential for setting up and maintaining
      SAN environments.
- id: nvme
  title: ONTAP REST API NVMe endpoints
  permalink: nvme_endpoints.html
  ai-gen:
    keywords: nvme fabrics,nvme services,nvme interfaces,fibre channel,nvme subsystems,nvme
      namespaces
    lead: Configure, provision, and manage NVMe-related objects using the NVMe REST
      API endpoints. These endpoints support both NVMe and NVMe-oF protocols, facilitating
      efficient data transport and management across NVMe interfaces, services, subsystem
      controllers, maps, subsystems, and namespaces.
- id: application
  title: ONTAP REST API application endpoints
  permalink: application_endpoints.html
  ai-gen:
    keywords: ontap storage, application management, storage provisioning, application
      templates, smart containers
    lead: ONTAP application endpoints streamline storage management by utilizing application-specific
      terminology to provision and manage storage objects. These endpoints facilitate
      a single call to set up storage and protocol access for applications according
      to NetApp best practices. Application APIs enable you to manage the ONTAP objects
      that constitute the application collectively, with available templates covering
      various database and virtualization applications.
- id: support
  title: ONTAP REST API support endpoints
  permalink: support_endpoints.html
  ai-gen:
    keywords: ontap support,configuration backups,event management,event handling,autosupport
      settings
    lead: Support endpoints help you manage configuration backups, autosupport settings,
      and event handling within your ONTAP environment. Use these APIs to safeguard
      critical settings and ensure timely event notifications.
- id: security
  title: ONTAP REST API security endpoints
  permalink: security_endpoints.html
  ai-gen:
    keywords: saml,security settings,cluster security,svm security,multi-factor authentication,identity
      provider
    lead: Use ONTAP security endpoints to manage security settings for your cluster
      and SVMs. Configure the SAML 2.0 SP protocol to integrate third-party identity
      providers for enhanced authentication measures.
- id: storage
  title: ONTAP REST API storage endpoints
  permalink: storage_endpoints.html
  ai-gen:
    keywords: storage management,aggregates,volumes,snapshots,storage efficiency,quotas
    lead: Manage physical and logical storage through ONTAP storage APIs. This includes
      handling aggregates, volumes, LUNs, qtrees, snapshots, quotas, and optimizing
      storage efficiency.
- id: snapmirror
  title: ONTAP REST API SnapMirror endpoints
  permalink: snapmirror_endpoints.html
  ai-gen:
    keywords: snapmirror technology,snapmirror backup,snapmirror restore,snapmirror
      policies,snapmirror relationships,snapmirror transfers
    lead: Utilize SnapMirror endpoints to efficiently create and manage data replication
      and backup relationships. These endpoints help maintain up-to-date copies of
      your production data across primary and secondary volumes, offering scalable
      solutions for disaster recovery and data restoration.
- id: ndmp
  title: ONTAP REST API NDMP endpoints
  permalink: ndmp_endpoints.html
  ai-gen:
    keywords: network data management,backup efficiency,file server restoration,svm
      aware backups,volume mobility
    lead: Utilize NDMP endpoints to streamline and optimize the backup and restoration
      processes for NAS environments. These endpoints enhance efficiency by providing
      standard commands for data protection and enabling direct data transfer paths
      to tape storage.
- id: snaplock
  title: ONTAP REST API SnapLock endpoints
  permalink: snaplock_endpoints.html
  ai-gen:
    keywords: snaplock compliance, snaplock retention, worm storage, snaplock legal
      hold, snaplock privileged delete, snaplock fingerprint
    lead: Use SnapLock endpoints to manage write once, read many (WORM) data storage,
      ensuring compliance and retention in regulatory environments. These endpoints
      facilitate file retention, privileged-delete operations, legal holds, and more,
      making them integral for handling non-rewritable storage securely.
- id: nas
  title: ONTAP REST API NAS endpoints
  permalink: nas_endpoints.html
  ai-gen:
    keywords: nfs server,export policies,export rules,kerberos configuration,specific
      authentication,svm management
    lead: Use NAS endpoints to configure and manage NFS servers, settings, and export
      policies on an SVM. These endpoints help you control access to your volumes
      and ensure robust authentication with Kerberos for secure data operations.
subcategories:
- id: manage application snapshots
  permalink: manage_application_snapshots.html
  ai-gen:
    keywords: application snapshots,snapshot creation,snapshot restoration,crash consistent,application
      consistent,snapcenter backup
    lead: Manage application snapshots across all member storage elements, facilitating
      creation and restoration as needed or on a scheduled basis. Use these endpoints
      to flag snapshots for consistency tracking, distinguishing between application
      consistent and crash consistent types. For optimal integration, consider using
      the SnapCenter Backup Management suite alongside these APIs.
- id: manage application consistency groups
  permalink: manage_application_consistency_groups.html
  ai-gen:
    keywords: consistency group,snapshot creation,volume management,write fence,crash
      consistent
    lead: Consistency group APIs manage collections of volumes to ensure application
      data remains consistent during operations like snapshots, replication, and cloning.
      Use these endpoints when working with datasets that span multiple volumes to
      maintain data integrity across the entire group.
- id: retrieve consistency group metrics
  permalink: retrieve_consistency_group_metrics.html
  ai-gen:
    keywords: consistency group,performance metrics,capacity metrics,space metrics,historical
      metrics
    lead: Retrieve historical performance and capacity metrics for consistency groups
      to analyze and optimize their performance over time. Use these endpoints to
      access data on latency, IOPS, throughput, and space utilization for better resource
      management and planning.
- id: manage application consistency group snapshots
  permalink: manage_application_consistency_group_snapshots.html
  ai-gen:
    keywords: application consistency,snapshot management,crash consistent,snapshot
      restore,consistency group
    lead: Consistency group snapshot endpoints facilitate the creation, management,
      and restoration of snapshots for application consistency groups. Use these APIs
      to perform on-demand or scheduled snapshot operations, supporting crash or application
      consistency types, with scheduled snapshots defaulting to crash consistent.
      Integrating with the SnapCenter Backup Management suite is recommended to coordinate
      snapshots with host applications effectively.
